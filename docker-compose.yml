name: tubus

# apps/api and apps/web are wired in as their Dockerfiles land (see ROADMAP.md Phase 1+).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tubus
      POSTGRES_PASSWORD: tubus
      POSTGRES_DB: tubus
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tubus -d tubus']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
