name: tubus

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tubus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tubus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tubus -d tubus']
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only reachable from other containers on this network.

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tubus:${POSTGRES_PASSWORD}@postgres:5432/tubus?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    # `migrate dev` never runs here or anywhere in production (README.md).

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tubus:${POSTGRES_PASSWORD}@postgres:5432/tubus?schema=public
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      ADMIN_HOST: ${ADMIN_HOST}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
